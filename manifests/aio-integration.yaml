apiVersion: v1
kind: Namespace
metadata:
  name: ai-workflows
  labels:
    ai-build-tools.ricolin.dev/evidence-class: emulated-mcapi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-build-tools-serving
  namespace: ai-workflows
secrets:
- name: ai-build-tools-s3
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ai-build-tools-kserve-manager
  namespace: ai-workflows
rules:
- apiGroups:
  - serving.kserve.io
  resources:
  - inferenceservices
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubeflow-pipeline-runner-ai-build-tools
  namespace: ai-workflows
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ai-build-tools-kserve-manager
subjects:
- kind: ServiceAccount
  name: pipeline-runner
  namespace: kubeflow
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ai-build-tools-seaweedfs-access
  namespace: kubeflow
spec:
  podSelector:
    matchLabels:
      app: seaweedfs
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ai-workflows
    ports:
    - port: 8333
      protocol: TCP
