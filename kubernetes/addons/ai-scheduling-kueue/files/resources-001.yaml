# Source: kueue/templates/manager/manager-config.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-scheduling-kueue-manager-config
  namespace: 'kueue-system'
  labels:
    helm.sh/chart: kueue-0.19.2
    app.kubernetes.io/name: kueue
    app.kubernetes.io/instance: ai-scheduling
    control-plane: controller-manager
    app.kubernetes.io/version: "v0.19.2"
    app.kubernetes.io/managed-by: Helm
data:
  controller_manager_config.yaml: |
    apiVersion: config.kueue.x-k8s.io/v1beta2
    clientConnection:
      burst: 500
      qps: 300
    controller:
      groupKindConcurrency:
        ClusterQueue.kueue.x-k8s.io: 5
        Job.batch: 5
        LocalQueue.kueue.x-k8s.io: 5
        Pod: 5
        ResourceFlavor.kueue.x-k8s.io: 1
        Workload.kueue.x-k8s.io: 10
    health:
      healthProbeBindAddress: :8081
    integrations:
      frameworks:
      - batch/job
      - kubeflow.org/mpijob
      - ray.io/rayjob
      - ray.io/rayservice
      - ray.io/raycluster
      - jobset.x-k8s.io/jobset
      - workload.codeflare.dev/appwrapper
      - trainer.kubeflow.org/trainjob
      - pod
      - deployment
      - statefulset
      - leaderworkerset.x-k8s.io/leaderworkerset
    internalCertManagement:
      enable: false
    kind: Configuration
    leaderElection:
      leaderElect: true
      resourceName: c1f6bfd2.kueue.x-k8s.io
    metrics:
      bindAddress: :8443
    webhook:
      port: 9443
---
