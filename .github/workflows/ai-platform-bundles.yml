name: AI platform bundles

on:
  workflow_dispatch:
    inputs:
      bundle:
        description: Reviewed Helm chart to package
        required: true
        type: choice
        options:
          - workspace
          - local-path-storage
        default: workspace
      publish:
        description: Publish the reviewed Helm charts to GHCR
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  charts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
        with:
          egress-policy: audit

      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4
        with:
          version: v3.19.0

      - name: Validate portable bundle contracts
        run: |
          ./kubernetes/addons/local-path-storage/test-render.sh
          ./kubernetes/bundles/workspace/test-render.sh
          ./kubernetes/bundles/kubeflow-kserve/test-contract.sh

      - name: Package selected chart
        env:
          BUNDLE: ${{ inputs.bundle }}
        run: |
          set -euo pipefail
          mkdir -p dist
          case "${BUNDLE}" in
            workspace)
              chart_dir=kubernetes/bundles/workspace
              ;;
            local-path-storage)
              chart_dir=kubernetes/addons/local-path-storage
              ;;
            *)
              echo "unsupported bundle: ${BUNDLE}" >&2
              exit 2
              ;;
          esac
          chart_name=$(awk '$1 == "name:" { print $2 }' "${chart_dir}/Chart.yaml")
          version=$(awk '$1 == "version:" { print $2 }' "${chart_dir}/Chart.yaml")
          helm package "${chart_dir}" --destination dist
          package="dist/${chart_name}-${version}.tgz"
          test -s "${package}"
          sha256sum "${package}"
          {
            printf 'CHART_NAME=%s\n' "${chart_name}"
            printf 'CHART_VERSION=%s\n' "${version}"
            printf 'CHART_PACKAGE=%s\n' "${package}"
          } >>"${GITHUB_ENV}"

      - name: Log in to GHCR
        if: inputs.publish
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish selected chart
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "${GH_TOKEN}" | helm registry login ghcr.io \
            --username "${GITHUB_ACTOR}" --password-stdin
          helm push "${CHART_PACKAGE}" \
            oci://ghcr.io/ricolin/ai-k8s-charts

      - name: Upload packaged chart
        uses: actions/upload-artifact@v4
        with:
          name: ai-platform-charts
          path: dist/*.tgz
          if-no-files-found: error
