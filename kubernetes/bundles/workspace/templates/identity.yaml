{{- include "ai-model-workspace.validate" . -}}
{{- if .Values.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ai-model-workspace.fullname" . }}-identity
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "ai-model-workspace.labels" . | nindent 4 }}
data:
  chart: {{ printf "%s-%s" .Chart.Name .Chart.Version | quote }}
  appVersion: {{ .Chart.AppVersion | quote }}
  storageMode: {{ .Values.storage.mode | quote }}
  retentionPolicy: {{ .Values.storage.retentionPolicy | quote }}
  pvcName: {{ .Values.storage.pvcName | quote }}
{{- end }}
