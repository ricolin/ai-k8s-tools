name: AI platform bundles

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the reviewed Helm charts to GHCR
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  charts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
        with:
          egress-policy: audit

      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4
        with:
          version: v3.19.0

      - name: Validate portable bundle contracts
        run: |
          ./kubernetes/bundles/workspace/test-render.sh
          ./kubernetes/bundles/kubeflow-kserve/test-contract.sh

      - name: Package workspace chart
        run: |
          set -euo pipefail
          mkdir -p dist
          version=$(awk '$1 == "version:" { print $2 }' \
            kubernetes/bundles/workspace/Chart.yaml)
          helm package kubernetes/bundles/workspace --destination dist
          test -s "dist/ai-model-workspace-${version}.tgz"
          sha256sum "dist/ai-model-workspace-${version}.tgz"

      - name: Log in to GHCR
        if: inputs.publish
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish workspace chart
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(awk '$1 == "version:" { print $2 }' \
            kubernetes/bundles/workspace/Chart.yaml)
          printf '%s' "${GH_TOKEN}" | helm registry login ghcr.io \
            --username "${GITHUB_ACTOR}" --password-stdin
          helm push "dist/ai-model-workspace-${version}.tgz" \
            oci://ghcr.io/ricolin/ai-k8s-charts

      - name: Upload packaged chart
        uses: actions/upload-artifact@v4
        with:
          name: ai-platform-charts
          path: dist/*.tgz
          if-no-files-found: error
