[project]
name = "ai-build-tools-kubernetes"
version = "0.1.0"
description = "Reusable Kubeflow and KServe workflow components for ai-build-tools"
requires-python = ">=3.12,<3.13"
dependencies = [
  "boto3==1.40.21",
  "model-registry==0.3.7",
]

[dependency-groups]
dev = [
  "kfp==2.16.0",
  "kfp-kubernetes==2.16.0",
  "pytest==8.4.1",
]

[project.scripts]
ai-k8s-workflow = "ai_build_tools_k8s.workflow:main"
ai-k8s-serve = "ai_build_tools_k8s.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_build_tools_k8s"]

[tool.pytest.ini_options]
testpaths = ["tests"]
